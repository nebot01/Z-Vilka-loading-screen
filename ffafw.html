<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Nikker going to your house</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #050505;
            color: #fff;
            user-select: none;
        }

        #bgSlider {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
        }

        .bg-image.active {
            opacity: 1;
        }

        .main-container {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.7) 100%);
        }

        .content-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 3;
        }

        .gif-container {
            width: 240px;
            height: 180px; 
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: rgba(0, 0, 0, 0.1);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            overflow: hidden;
        }

        .gif-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.75; /* Сделал гифку прозрачной на 35%, чтобы она не перекрывала фон */
        }

        .title {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-top: 20px;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 0 2px 8px rgba(0,0,0,0.8);
        }

        .loader-logs {
            position: absolute;
            top: calc(50% + 140px); 
            left: 50%;
            transform: translateX(-50%);
            bottom: 20px; 
            width: 100%;
            max-width: 700px;
            display: flex;
            flex-direction: column; 
            align-items: center;
            justify-content: flex-start;
            overflow: hidden;
        }

        .log-item {
            font-size: 16px;
            font-weight: 500;
            color: #ffffff;
            margin: 5px 0;
            transition: all 0.3s ease-in-out;
            transform: translateY(-10px);
            opacity: 0;
            text-align: center;
            max-width: 90%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 0 1px 4px rgba(0,0,0,0.8);
        }

        .log-item.spawn {
            transform: translateY(0);
            opacity: 1;
        }

        .log-item:nth-child(2) { opacity: 0.60; transform: scale(0.95); }
        .log-item:nth-child(3) { opacity: 0.35; transform: scale(0.90); }
        .log-item:nth-child(4) { opacity: 0.15; transform: scale(0.85); }
        .log-item:nth-child(5) { opacity: 0.05; transform: scale(0.80); }
        .log-item:nth-child(n+6) { opacity: 0; transform: scale(0.75); }
    </style>
</head>
<body>

    <div class="background-slider" id="bgSlider"></div>

    <div class="main-container">
        
        <div class="content-box">
            <div class="gif-container">
                <img src="ecospace-compostable.gif" alt="Z-Вилка GIF">
            </div>
            <h1 class="title">Z-Вилка</h1>
        </div>

        <div class="loader-logs" id="logsContainer"></div>
        
    </div>

    <audio id="loadingMusic" autoplay loop></audio>

    <script>
        const images = [
            'nikker1.png',
            'nikker2.png',
            'nikker3.png'
        ];

        const songs = [
            'nikker1.mp3',
            'nikker2.mp3',
            'nikker3.mp3',
            'nikker4.mp3'
        ];

        const bgSlider = document.getElementById('bgSlider');
        images.forEach((src, idx) => {
            const div = document.createElement('div');
            div.className = `bg-image ${idx === 0 ? 'active' : ''}`;
            div.style.backgroundImage = `url('${src}')`;
            bgSlider.appendChild(div);
        });

        const bgElements = document.querySelectorAll('.bg-image');
        let currentImgIndex = 0;

        setInterval(() => {
            bgElements[currentImgIndex].classList.remove('active');
            let nextIndex = currentImgIndex;
            while (nextIndex === currentImgIndex && images.length > 1) {
                nextIndex = Math.floor(Math.random() * images.length);
            }
            currentImgIndex = nextIndex;
            bgElements[currentImgIndex].classList.add('active');
        }, 5000);

        const audioPlayer = document.getElementById('loadingMusic');
        audioPlayer.volume = 0.04;
        
        let currentSongIndex = Math.floor(Math.random() * songs.length);
        let musicStarted = false;

        function playNextSong() {
            audioPlayer.src = songs[currentSongIndex];
            audioPlayer.play().then(() => {
                musicStarted = true;
            }).catch(error => {
                console.log("Ожидание активности для старта музыки...");
            });
            currentSongIndex = (currentSongIndex + 1) % songs.length;
        }

        audioPlayer.addEventListener('ended', playNextSong);
        playNextSong();

        function forceStartMusic() {
            if (!musicStarted) {
                audioPlayer.play().then(() => {
                    musicStarted = true;
                    removeTriggers();
                }).catch(() => {});
            }
        }

        function removeTriggers() {
            window.removeEventListener('click', forceStartMusic);
            window.removeEventListener('mousemove', forceStartMusic);
            window.removeEventListener('keydown', forceStartMusic);
            document.removeEventListener('DOMContentLoaded', forceStartMusic);
        }

        window.addEventListener('click', forceStartMusic);
        window.addEventListener('mousemove', forceStartMusic);
        window.addEventListener('keydown', forceStartMusic);
        document.addEventListener('DOMContentLoaded', forceStartMusic);

        const logsContainer = document.getElementById('logsContainer');
        let lastLogText = "";

        function addLog(text) {
            forceStartMusic();

            if (!text || text === lastLogText) return; 
            lastLogText = text;

            const logItem = document.createElement('div');
            logItem.className = 'log-item';
            logItem.innerText = text;

            logsContainer.insertBefore(logItem, logsContainer.firstChild);

            setTimeout(() => { logItem.classList.add('spawn'); }, 15);

            if (logsContainer.children.length > 12) {
                logsContainer.removeChild(logsContainer.lastChild);
            }
        }

        // Интеграция с Garry's Mod API
        function SetStatusChanged(status) {
            if(status) addLog(status);
        }

        function DownloadingFile(fileName) {
            let cleanName = fileName.replace(/["']/g, "");
            addLog("Downloading: " + cleanName);
        }
